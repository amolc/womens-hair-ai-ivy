<!DOCTYPE html>
<html>
<head>
    <title>Test Custom Answer</title>
</head>
<body>
    <h1>Testing Custom Answer API</h1>
    <button onclick="testCustomAnswer()">Test "Who is Kann"</button>
    <div id="result"></div>

    <script>
        async function testCustomAnswer() {
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('https://api-stage.ivybears.ai/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Who is Kann",
                        assistant_name: "Ada",
                        detected_language: "en",
                        session_id: "test-session-123",
                        input_type: 0
                    })
                });

                const data = await response.json();
                console.log('Full API Response:', data);
                
                resultDiv.innerHTML = `
                    <h3>API Response:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <h3>Answer:</h3>
                    <p>${data.answer || 'No answer field'}</p>
                    <h3>Status:</h3>
                    <p>HTTP Status: ${response.status}</p>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
